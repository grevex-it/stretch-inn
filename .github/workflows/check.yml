# Corre pnpm check en cada pull request y en cada push a main. Avisa, no bloquea (ver 0006).
name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
